<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f5e63">
  <title>Sin conexión · ReportaYa</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f5f4; color: #1c2526; text-align: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 380px; }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #5f6b6c; margin: 0 0 20px; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #0f5e63; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="ReportaYa">
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar esta página. Tus reportes siguen guardados en el dispositivo; vuelve a intentarlo cuando tengas internet.</p>
    <button onclick="location.href='./'">Reintentar</button>
  </div>
  <script>window.addEventListener('online', () => location.href = './');</script>
</body>
</html>
