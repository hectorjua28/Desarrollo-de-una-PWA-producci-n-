# Sitio estático: no requiere compilación, se publica la raíz del proyecto.
[build]
  publish = "."

# El Service Worker siempre se revalida para detectar nuevas versiones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Encabezados de seguridad básicos para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
