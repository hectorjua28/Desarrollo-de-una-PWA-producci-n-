<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ReportaYa · Incidencias urbanas</title>
  <meta name="description" content="PWA para reportar incidencias urbanas (baches, luminarias, basura, fugas) con foto, ubicación GPS y funcionamiento sin conexión.">

  <!-- Instalabilidad -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f5e63">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReportaYa">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ===================== APP SHELL (estático) ===================== -->
  <div class="shell" id="shell">

    <header class="topbar">
      <a class="brand" href="#/inicio" aria-label="Ir al inicio">
        <img src="icons/icon-96.png" alt="" width="32" height="32">
        <span>Reporta<strong>Ya</strong></span>
      </a>

      <div class="topbar__actions">
        <span class="net-pill" id="netStatus" role="status" aria-live="polite">En línea</span>
        <button class="btn btn--ghost btn--sm hidden" id="btnInstall" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
          Instalar
        </button>
      </div>
    </header>

    <!-- Navegación lateral (escritorio) / inferior (móvil) -->
    <nav class="nav hidden" id="mainNav" aria-label="Navegación principal">
      <a href="#/inicio" data-route="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#/reportes" data-route="reportes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Reportes</span>
      </a>
      <a href="#/nuevo" data-route="nuevo" class="nav__cta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nuevo</span>
      </a>
      <a href="#/ajustes" data-route="ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Perfil</span>
      </a>
    </nav>

    <!-- Contenedor de contenido dinámico (CSR) -->
    <main class="content" id="app" tabindex="-1" aria-live="polite">
      <div class="skeleton">
        <div class="skeleton__line w60"></div>
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
      </div>
    </main>
  </div>

  <!-- Avisos -->
  <div class="toast-zone" id="toasts" aria-live="assertive"></div>

  <noscript>
    <p class="noscript">ReportaYa necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
